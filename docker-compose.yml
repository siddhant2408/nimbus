# Development : build the backend/web images from the current checkout
services:

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: nimbus-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nimbus}:${POSTGRES_PASSWORD:-nimbus}@postgres:5432/${POSTGRES_DB:-nimbus}?sslmode=disable
      PORT: "${PORT:-8080}"
    restart: unless-stopped

  frontend:
    image: nimbus-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: http://backend:8081
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: dev
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
